<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog</title>
        <style>
            header {
                background-color: #183C63;
                color: #FFFFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
            }

            main {
                background-color: rgb(247, 253, 247);
                color: #070404;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                /* Flexbox para alinhar a imagem e a div de textos lado a lado */
                display: flex;
                align-items: center;
                gap: 16px;
            }

            img {
                width: 80px;
                height: 80px;
                object-fit: cover;
                display: block;
            }

            /* Classe específica para destacar apenas o nome do autor */
            .artigo-autor {
                font-weight: bold;
            }

            /* Estilização para o botão de reação */
            button {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 6px 12px;
                border: 1px solid #ccc;
                border-radius: 16px;
                background-color: #ffffff;
                cursor: pointer;
                margin-top: 10px;
                margin-right: 6px;
                font-size: 14px;
            }

            button:hover {
                background-color: #f0f0f0;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Meu blog tech</h1>
            <p>Vou compartilhar conhecimento sobre tecnologia e programação</p>
        </header>
        <main>
            <img src="imagem. blog.png" alt="Logotipo conceitual de tecnologia e educação: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco.">
            
            <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: Marcelo Henrique</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
                
                <!-- Botões com emojis e contadores -->
                <button>❤️ <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
        </main>

        <!-- Script com a lógica de interatividade JavaScript -->
        <script>
            // Seleciona todos os botões da página
            const botoes = document.querySelectorAll("button");
            
            // Percorre cada botão da lista
            botoes.forEach(function(botao) {
                // Adiciona o ouvinte de evento para cada botão
                botao.addEventListener("click", function() {
                    console.log("fui clicado");
                    let texto = botao.querySelector("span");
                    texto.textContent++;
                });
            });
        </script>
    </body>
</html>
